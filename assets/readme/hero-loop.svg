<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&amp;family=ZCOOL+XiaoWei&amp;display=swap');
      .hand { font-family: 'Ma Shan Zheng','ZCOOL XiaoWei','Segoe Print',cursive; }
    </style>
  </defs>

  <!-- 底色 -->
  <rect x="0" y="0" width="800" height="450" fill="#fafaf7"/>

  <!-- 标题（手写大标题）+ 抖动黄下划线 -->
  <text x="400" y="60" text-anchor="middle" font-size="34" fill="#1a1a1a" class="hand" font-weight="bold">记忆 · PDCA · 文档 —— 一次协作的完整闭环</text>
  <path d="M190,74 C270,72 350,76 440,73 C520,71 580,75 625,72" stroke="#f5c842" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ===== 上节点：自己的记忆 ===== -->
  <path d="M288,98 C310,94 478,96 502,98 C512,100 514,104 512,108 C510,112 508,140 506,144 C470,150 320,150 292,144 C284,140 282,104 288,98Z"
    stroke="#1a1a1a" stroke-width="2" fill="#fef9e7" stroke-linejoin="round"/>
  <text x="400" y="120" text-anchor="middle" font-size="22" fill="#1a1a1a" class="hand">自己的记忆</text>
  <text x="400" y="139" text-anchor="middle" font-size="13" fill="#4a90d9" class="hand">跟你走 · 升级不丢 · 越用越厚</text>

  <!-- 记忆 → PDCA 箭头（输入） -->
  <path d="M400,156 C400,166 400,172 400,182" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M394,178 L400,192 L406,178Z" fill="#1a1a1a"/>
  <text x="416" y="176" text-anchor="start" font-size="13" fill="#1a1a1a" class="hand">输入</text>

  <!-- ===== 中节点：PDCA ===== -->
  <path d="M288,196 C310,192 478,194 502,196 C512,198 514,202 512,206 C510,210 508,238 506,242 C470,248 320,248 292,242 C284,238 282,202 288,196Z"
    stroke="#1a1a1a" stroke-width="2" fill="#fef9e7" stroke-linejoin="round"/>
  <text x="400" y="218" text-anchor="middle" font-size="22" fill="#1a1a1a" class="hand">PDCA</text>
  <text x="400" y="237" text-anchor="middle" font-size="13" fill="#4a90d9" class="hand">/plan → /do → /check → /act</text>

  <!-- PDCA → 文档 箭头（落盘） -->
  <path d="M400,254 C400,264 400,270 400,280" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M394,276 L400,290 L406,276Z" fill="#1a1a1a"/>
  <text x="416" y="274" text-anchor="start" font-size="13" fill="#1a1a1a" class="hand">落盘</text>

  <!-- ===== 下节点：文档规整 ===== -->
  <path d="M288,294 C310,290 478,292 502,294 C512,296 514,300 512,304 C510,308 508,336 506,340 C470,346 320,346 292,340 C284,336 282,300 288,294Z"
    stroke="#1a1a1a" stroke-width="2" fill="#fef9e7" stroke-linejoin="round"/>
  <text x="400" y="316" text-anchor="middle" font-size="22" fill="#1a1a1a" class="hand">文档规整</text>
  <text x="400" y="335" text-anchor="middle" font-size="13" fill="#4a90d9" class="hand">spec · task · handoff · SUMMARY</text>

  <!-- ===== 右侧闭环箭头：文档 → 记忆（反哺 · 闭环） ===== -->
  <path d="M512,316 C580,318 640,296 640,240 C640,184 610,148 560,140 C540,137 530,134 524,130"
    stroke="#e05a4e" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="7,5"/>
  <path d="M532,136 L522,124 L516,138Z" fill="#e05a4e"/>
  <text x="656" y="240" text-anchor="middle" font-size="14" fill="#e05a4e" class="hand">反哺 · 闭环</text>

  <!-- ===== 底部标语 ===== -->
  <text x="400" y="412" text-anchor="middle" font-size="17" fill="#e05a4e" class="hand">AI 是流水的兵，记忆是铁打的营盘</text>
  <path d="M230,424 C310,422 420,426 570,423" stroke="#f5c842" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
